# FRED 거시지표(CPI·PCE·PPI·NFP 등) → Supabase fred_economic_releases
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FRED_API_KEY
name: FRED macro sync

on:
  schedule:
    # 월·목 11:00 UTC ≈ 한국 20:00 — 미국 지표 발표일 전후 갱신
    - cron: '0 11 * * 1,4'
  workflow_dispatch:

concurrency:
  group: fred-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kis-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync FRED releases
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python sync_fred_releases.py
